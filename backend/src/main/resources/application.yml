spring:
  application:
    name: qlinkr-backend

  # In dev, Spring Boot reads ../compose.yaml, starts Oracle and Redis, and
  # wires the connection details itself. Tests use Testcontainers instead.
  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it

  flyway:
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

qlinkr:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 720h
    issuer: qlinkr
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  rate-limit:
    window: PT1M
    browse-per-ip: 120
    orders-per-ip: 10
    orders-per-scan-point: 30
  demo:
    enabled: ${DEMO_ENABLED:false}   # creates a demo café with a fixed QR code
    password: ${DEMO_PASSWORD:}
  bootstrap:
    admin-email: ${PLATFORM_ADMIN_EMAIL:}
    admin-password: ${PLATFORM_ADMIN_PASSWORD:}

server:
  port: 8080
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: QlinkR Order
    phase: 7
